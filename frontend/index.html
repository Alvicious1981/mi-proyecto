<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotebookLM MCP · Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-blobs"></div>
    <main class="layout">
      <aside class="glass sidebar">
        <h1>NotebookLM MCP</h1>
        <p class="subtitle">Modo privado · Panel MVP</p>
        <nav>
          <button class="nav-btn active">Estado</button>
          <button class="nav-btn">Tools</button>
          <button class="nav-btn">Resources</button>
          <button class="nav-btn">Prompts</button>
          <button class="nav-btn">Auditoría</button>
        </nav>
      </aside>

      <section class="content">
        <header class="glass topbar">
          <div>
            <h2>Resumen de compatibilidad</h2>
            <p>Vista rápida para validar integración con Agent Manager.</p>
          </div>
          <span id="compatibility-badge" class="badge">Cargando...</span>
        </header>

        <div class="cards">
          <article class="glass card">
            <h3>Servidor</h3>
            <ul id="server-info"></ul>
          </article>

          <article class="glass card">
            <h3>Capacidades</h3>
            <ul id="capabilities"></ul>
          </article>

          <article class="glass card wide">
            <h3>Checks</h3>
            <ul id="checks"></ul>
          </article>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
